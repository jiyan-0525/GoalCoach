[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goalcoach"
version = "0.1.0"
description = "Adaptive agentic learning coach for HSK Chinese"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28.1",
  "opentelemetry-api<1.44.0",
  "opentelemetry-sdk<1.44.0",
  "pydantic>=2.8,<3",
  "pydantic-ai>=0.0.14",
  "pydantic-settings>=2.4,<3",
  "pytest>=8.4.2",
  "pytest-asyncio>=0.26.0",
  "sqlalchemy>=2.0,<3",
  "tzdata; sys_platform == 'win32'",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ai = [
  "openai>=1.40,<2",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:logfire"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "B008",    # FastAPI Depends() in endpoint parameters
    "E501",    # Line length handled by formatter
]

[project.scripts]
goalcoach = "goalcoach.agents.terminal_harness:run_cli"
